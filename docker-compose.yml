---
# RUDY USB/IP client: attaches the KNX ETS5 license stick that is physically
# connected to `dongle-host` onto this host's USB subsystem, so ETS5 under Wine sees
# it as a local HID device.
#
# Host requirement: kernel module vhci-hcd, persisted in
# /etc/modules-load.d/vhci-hcd.conf.
#
# The server side lives in the `compose-stack` Compose project on dongle-host
# (dongle-host:~/dongle-host/compose-stack/compose/home.yaml, service `rudy-server`).
services:
  rudy-client:
    image: ckware/rudy-client:2024-03-20-bookworm@sha256:2d0737d9d06fcf66d46273dbf54bc5813088dda25e75b7bf83bcf72655470307
    container_name: rudy-client
    init: true
    restart: unless-stopped

    # Required by RUDY: the client writes to /sys/devices/platform/vhci_hcd.0,
    # and AppArmor's docker-default profile denies all /sys writes regardless of
    # mount flags or capabilities (moby#22825).
    privileged: true

    # Host networking so the TCP socket that `usbip attach` hands to the kernel
    # is created in the host network namespace, exactly as native usbip would.
    # On a bridge network the kernel would hold a socket belonging to the
    # container's netns, which ties the attached device's lifetime to that
    # namespace. Also makes USBIP_SERVER resolve via host DNS.
    network_mode: host

    # MQTT self-healing against the mosquitto broker in the compose-stack stack.
    # Without it, restarting rudy-server leaves this client holding a stale
    # attachment and the stick disappears from lsusb until it is reloaded by
    # hand. Subscribing to rudy/server/start makes that automatic.
    #
    # The credentials are kept out of this file because mosquitto_pub/_sub take
    # the password inline, which makes the whole option string a secret.
    # Broker identity `rudy-client` may only write rudy/client/# and read
    # rudy/server/# (see dongle-host:~/dongle-host/compose-stack/etc-mosquitto/acl).
    env_file:
      - /home/steve/.config/ets5-rudy/rudy-client.env

    environment:
      USBIP_SERVER: "dongle-host.example"
      USBIP_PORT: "3240"
      MQTT_PUBLISH_TO_TOPIC: "rudy/client"
      MQTT_RELOAD_ON_TOPIC: "rudy/server/start"
      # Same public VID:PID as the server. The stick is the only 2a07 device,
      # so no serial filter is needed and no bus id is pinned.
      USBIP_DEVICE_IDS: "2a07:0102"
      # Detach matching ports on shutdown so a stale attachment cannot block a
      # later reattach. Scoped to USBIP_DEVICE_IDS, so unrelated USB/IP devices
      # on this host are untouched (unlike USBIP_DETACH_ALL).
      USBIP_DETACH_ORPHANS: "true"
      TZ: Europe/Berlin

    volumes:
      # usbip keeps per-port attach state here; it mirrors kernel state and must
      # be shared with the host so host-side `usbip port` agrees with the client.
      - /var/run/vhci_hcd:/var/run/vhci_hcd

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
